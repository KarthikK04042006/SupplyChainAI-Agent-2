[pytest]
# The service is a flat package tree rooted here, so tests import `main`,
# `services`, and `models` directly. Without this, pytest only puts `tests/` on
# the path and every import fails.
pythonpath = .
testpaths = tests

# Statistical fits are noisy by nature — convergence warnings on short training
# folds are expected and handled, not defects. Silence them so a real warning is
# visible in the output.
filterwarnings =
    ignore::FutureWarning
    ignore::UserWarning
    ignore::RuntimeWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

markers =
    slow: exercises the full candidate pool including Prophet
