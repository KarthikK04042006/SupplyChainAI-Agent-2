services:
  mysql:
    image: mysql:8.0
    container_name: supply-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: demand_forecast
      MYSQL_USER: supply
      MYSQL_PASSWORD: supplypass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - supply-net

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: supply-ml-service
    restart: unless-stopped
    environment:
      ML_HOST: 0.0.0.0
      ML_PORT: 8000
      ML_LOG_LEVEL: info
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - supply-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: supply-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/demand_forecast?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: supply
      SPRING_DATASOURCE_PASSWORD: supplypass
      ML_SERVICE_URL: http://ml-service:8000
      # Both default to empty, which is exactly the behaviour without these lines: the app
      # generates a signing key and an admin password and logs the password once. They exist
      # so an operator *can* pin them from the host environment — without a passthrough the
      # app never sees the variable, and the seeded password is only ever recoverable from
      # the first boot's logs.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - supply-net

volumes:
  mysql-data:
    driver: local

networks:
  supply-net:
    driver: bridge
