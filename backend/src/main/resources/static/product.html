<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product — Supply Forecast</title>
  <link rel="stylesheet" href="vendor/bootstrap.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="nav"></div>

  <main class="container-fluid py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-3">
      <div>
        <h1 class="h3 mb-0" id="title">Products</h1>
        <p class="text-body-secondary small mb-0" id="subtitle">
          Pick a product to see its forecast.
        </p>
      </div>
      <div class="d-flex flex-wrap gap-2 align-items-end">
        <div>
          <label for="search" class="form-label small mb-1">Search</label>
          <input type="search" class="form-control form-control-sm" id="search"
                 placeholder="SKU or name" style="width: 11rem;">
        </div>
        <div>
          <label for="category" class="form-label small mb-1">Category</label>
          <select class="form-select form-select-sm" id="category" style="width: auto;">
            <option value="">All categories</option>
          </select>
        </div>
        <div>
          <label for="product" class="form-label small mb-1">Product</label>
          <select class="form-select form-select-sm" id="product" style="width: 17rem;">
            <option value="">Loading…</option>
          </select>
        </div>
        <div>
          <label for="horizon" class="form-label small mb-1">Horizon</label>
          <select class="form-select form-select-sm" id="horizon" style="width: auto;">
            <option value="14">14 days</option>
            <option value="30" selected>30 days</option>
            <option value="60">60 days</option>
            <option value="90">90 days</option>
          </select>
        </div>
        <button class="btn btn-sm btn-outline-secondary" id="refresh" type="button">Refresh</button>
      </div>
    </div>

    <div id="message"></div>

    <!-- Anomalies and forecast warnings, rendered by js/product.js. Above the chart because they
         qualify every number below them. -->
    <div id="banners"></div>

    <div class="row g-3 mb-3" id="statCards">
      <div class="col-6 col-lg-3">
        <div class="card kpi-card h-100">
          <div class="card-body">
            <h2 class="h6 text-body-secondary">On hand</h2>
            <p class="kpi-value mb-1" id="statOnHand">—</p>
            <p class="kpi-note mb-0" id="statOnHandNote">&nbsp;</p>
          </div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card kpi-card h-100">
          <div class="card-body">
            <h2 class="h6 text-body-secondary">Inventory position</h2>
            <p class="kpi-value mb-1" id="statPosition">—</p>
            <p class="kpi-note mb-0" id="statPositionNote">&nbsp;</p>
          </div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card kpi-card h-100">
          <div class="card-body">
            <h2 class="h6 text-body-secondary">Lead time</h2>
            <p class="kpi-value mb-1" id="statLeadTime">—</p>
            <p class="kpi-note mb-0" id="statLeadTimeNote">&nbsp;</p>
          </div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card kpi-card h-100">
          <div class="card-body">
            <h2 class="h6 text-body-secondary">Stock value</h2>
            <p class="kpi-value mb-1" id="statValue">—</p>
            <p class="kpi-note mb-0" id="statValueNote">&nbsp;</p>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-12 col-xl-8">
        <div class="card h-100">
          <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
            <h2 class="h6 mb-0">Demand history and forecast</h2>
            <span class="small text-body-secondary" id="chartNote"></span>
          </div>
          <div class="card-body">
            <!-- Fixed-height wrapper: Chart.js with maintainAspectRatio:false grows to its parent,
                 and an unconstrained parent makes it grow on every resize event. -->
            <div class="chart-wrap">
              <canvas id="forecastChart" aria-label="Demand history and forecast" role="img">
              </canvas>
            </div>
            <p class="small text-body-secondary mb-0 mt-2" id="chartLegendNote"></p>
          </div>
        </div>
      </div>

      <div class="col-12 col-xl-4">
        <div class="card h-100">
          <div class="card-header">
            <h2 class="h6 mb-0">Reorder recommendation</h2>
          </div>
          <div class="card-body" id="reorderPanel">
            <p class="text-body-secondary mb-0">Loading…</p>
          </div>
        </div>
      </div>

      <div class="col-12 col-xl-8">
        <div class="card">
          <div class="card-header">
            <h2 class="h6 mb-0">Why this forecast</h2>
          </div>
          <div class="card-body" id="explainPanel">
            <p class="text-body-secondary mb-0">Loading…</p>
          </div>
        </div>
      </div>

      <div class="col-12 col-xl-4">
        <div class="card">
          <div class="card-header">
            <h2 class="h6 mb-0">Model selection</h2>
          </div>
          <div class="card-body" id="modelPanel">
            <p class="text-body-secondary mb-0">Loading…</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="vendor/bootstrap.bundle.min.js"></script>
  <script src="vendor/chart.umd.min.js"></script>
  <script type="module" src="js/product.js"></script>
</body>
</html>
