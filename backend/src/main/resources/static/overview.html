<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overview — Supply Forecast</title>
  <link rel="stylesheet" href="vendor/bootstrap.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="nav"></div>

  <main class="container-fluid py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h1 class="h3 mb-0">Overview</h1>
        <p class="text-body-secondary small mb-0" id="scanNote">Loading…</p>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-outline-secondary" id="refresh" type="button">Refresh</button>
        <!-- MANAGER and up: a scan writes alert rows. Rendered by js/overview.js, not hidden
             with CSS, so the markup a VIEWER receives has no scan button in it at all. -->
        <span id="scanSlot"></span>
      </div>
    </div>

    <div id="message"></div>

    <div class="row g-3 mb-4" id="kpis">
      <div class="col-12 col-sm-6 col-xl-3">
        <div class="card kpi-card h-100">
          <div class="card-body">
            <h2 class="h6 text-body-secondary">Total SKUs</h2>
            <p class="kpi-value mb-1" id="kpiSkus">—</p>
            <p class="kpi-note mb-0" id="kpiSkusNote">&nbsp;</p>
          </div>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-xl-3">
        <div class="card kpi-card h-100">
          <div class="card-body">
            <h2 class="h6 text-body-secondary">Active alerts</h2>
            <p class="kpi-value mb-1" id="kpiAlerts">—</p>
            <p class="kpi-note mb-0" id="kpiAlertsNote">&nbsp;</p>
          </div>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-xl-3">
        <div class="card kpi-card h-100">
          <div class="card-body">
            <h2 class="h6 text-body-secondary">Inventory value</h2>
            <p class="kpi-value mb-1" id="kpiValue">—</p>
            <p class="kpi-note mb-0" id="kpiValueNote">&nbsp;</p>
          </div>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-xl-3">
        <div class="card kpi-card h-100">
          <div class="card-body">
            <h2 class="h6 text-body-secondary">Avg forecast accuracy</h2>
            <p class="kpi-value mb-1" id="kpiAccuracy">—</p>
            <p class="kpi-note mb-0" id="kpiAccuracyNote">&nbsp;</p>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
        <h2 class="h6 mb-0">Open alerts</h2>
        <div class="d-flex flex-wrap gap-2">
          <select class="form-select form-select-sm" id="filterSeverity"
                  aria-label="Filter by severity" style="width: auto;">
            <option value="">All severities</option>
            <option value="CRITICAL">Critical</option>
            <option value="HIGH">High</option>
            <option value="MEDIUM">Medium</option>
            <option value="LOW">Low</option>
          </select>
          <select class="form-select form-select-sm" id="filterType"
                  aria-label="Filter by type" style="width: auto;">
            <option value="">All types</option>
            <!-- One option per AlertType constant. The backend binds this straight through
                 Enum.valueOf, so a name that is not a constant is a 400 rather than an empty
                 result — which reads on the page as the alert list having failed to load. -->
            <option value="STOCKOUT_RISK">Stockout risk</option>
            <option value="OVERSTOCK">Overstock</option>
            <option value="DEMAND_ANOMALY">Demand anomaly</option>
          </select>
          <select class="form-select form-select-sm" id="filterResolved"
                  aria-label="Filter by state" style="width: auto;">
            <option value="false">Open only</option>
            <option value="true">Resolved only</option>
            <option value="">All</option>
          </select>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <caption class="visually-hidden">Inventory alerts, most urgent first</caption>
          <thead>
            <tr>
              <th scope="col">Severity</th>
              <th scope="col">SKU</th>
              <th scope="col">Type</th>
              <th scope="col">Message</th>
              <th scope="col" class="text-end">Days of supply</th>
              <th scope="col">Detected</th>
              <th scope="col"></th>
            </tr>
          </thead>
          <tbody id="alertRows">
            <tr><td colspan="7" class="text-center text-body-secondary py-4">Loading…</td></tr>
          </tbody>
        </table>
      </div>
      <div class="card-footer d-flex justify-content-between align-items-center">
        <span class="small text-body-secondary" id="alertCount"></span>
        <div class="btn-group btn-group-sm">
          <button class="btn btn-outline-secondary" id="prevPage" type="button">Previous</button>
          <button class="btn btn-outline-secondary" id="nextPage" type="button">Next</button>
        </div>
      </div>
    </div>
  </main>

  <script src="vendor/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/overview.js"></script>
</body>
</html>
