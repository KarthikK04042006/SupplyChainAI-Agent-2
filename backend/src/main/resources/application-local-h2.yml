# Local run with no MySQL available: in-memory H2 in MySQL compatibility mode.
#
# H2 is test-scoped in the pom, so it is not on the runtime classpath by default. Start with:
#
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local-h2 \
#       -Dspring-boot.run.useTestClasspath=true
#
# This is a convenience for exercising the API and dashboard without a database install. It
# does not substitute for the `local` profile: data lives only as long as the process, and
# anything dialect-sensitive (native queries, MySQL-specific DDL) is not covered here.
spring:
  datasource:
    url: jdbc:h2:mem:demandforecast;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

ml:
  service:
    url: http://localhost:8000

logging:
  level:
    com.supply.demandforecast: DEBUG
